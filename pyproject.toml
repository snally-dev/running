[project]
name = "running"
version = "0.1.0"
description = "Build an analysis-ready CSV from Caleb's Strava running history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fitdecode>=0.11.0",
  "httpx>=0.28.1",
  "plotnine>=0.15.8",
  "polars>=1.44.1",
  "pyarrow>=25.0.1",
]

[project.scripts]
running-sync = "running.sync:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.16.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
